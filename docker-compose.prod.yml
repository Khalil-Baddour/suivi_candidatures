services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      retries: 5
    networks:
      - internal

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    env_file: .env.prod
    volumes:
      - media_files:/app/media
    expose:
      - "8000"
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - internal
      - portfolio_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.suivi-candidatures.rule=Host(`follow-myapplications.kbaddour.fr`)"
      - "traefik.http.routers.suivi-candidatures.entrypoints=websecure"
      - "traefik.http.routers.suivi-candidatures.tls.certresolver=letsencrypt"
      - "traefik.http.services.suivi-candidatures.loadbalancer.server.port=80"
      - "traefik.docker.network=portfolio_default"

volumes:
  postgres_data:
  media_files:

networks:
  internal:
    driver: bridge
  portfolio_default:
    external: true
